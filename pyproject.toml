[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-backlash-tracker"
version = "0.1.0"
description = "Free-data collation pipeline for organized AI opposition evidence in the US"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — internal scaffold" }
authors = [{ name = "Aden Barton" }]
dependencies = []

[project.optional-dependencies]
news = ["mediacloud"]
parquet = ["pyarrow"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
abt-fips = "src.geo.fips:main"
